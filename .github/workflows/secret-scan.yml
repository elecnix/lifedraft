name: Secret scan

# Scans every PR and every push to main for secrets, with three detectors:
#
#   1. gitleaks       — via the OFFICIAL action (gitleaks/gitleaks-action).
#     On pull_request it scans exactly the commits the PR adds
#     (base^..head, --no-merges --first-parent), comments inline on the PR
#     when something fires, and uploads a SARIF artifact. Rule set and
#     triaged false positives live in .gitleaks.toml (auto-detected).
#   2. trufflehog     — via cboone/gh-actions/actions/run-trufflehog, a
#     Docker-less composite that downloads a PINNED trufflehog binary,
#     verifies it against the release's own checksums.txt, and runs it with
#     our args. The OFFICIAL action (trufflesecurity/trufflehog) is a
#     composite that shells out to `docker run ghcr.io/trufflesecurity/trufflehog`,
#     and the self-hosted runners for this repo have no Docker daemon
#     (every existing job downloads plain
#     binaries instead — see the clone-detection workflow). 800+ detectors
#     with live verification against the issuing provider; --only-verified
#     + --fail means only VERIFIED findings fail the build.
#   3. detect-secrets — via elecnix/detect-secrets-action (SHA-pinned), a
#     composite action shipped because Yelp publishes no action and every
#     third-party one was disqualified (reviewdog's is Docker-based; the
#     closest composite alternative rewrites the baseline in CI and keys
#     "new" off audit categories). It runs a baseline-diffed tree scan and
#     fails only on findings NOT in the audited baseline (.secrets.baseline),
#     compared on (path, type, hash) — never line numbers, so code movement
#     cannot fail the build. The gate logic and its tests live in the action
#     repo (unit tests + three integration fixtures on real fixture repos),
#     mirroring how this repo consumes elecnix/dupdelta.
#
# The three overlap deliberately. This repo exists because silent substitution
# once shipped a confident wrong number (DP#32); the same failure mode with
# secrets is "scanner X's rule set didn't know this shape". Any ONE scanner
# firing fails the PR; they are cheap enough to run all three.
#
# Known false positives are triaged, cited, and structural:
#   - gitleaks: .gitleaks.toml [allowlist] (citations inline).
#   - detect-secrets: .secrets.baseline (audited; the entries' false-positive
#     mechanisms are cited in the triaging PR and in the action's README).
#   - trufflehog needs no allowlist: verification is its own false-positive
#     filter.
#
# License note on gitleaks-action: the action's source carries the
# GITLEAKS-ACTION EULA — free for PERSONAL accounts, license key required for
# organization accounts (GITLEAKS_LICENSE). This repo is a personal account,
# so no key is needed; if it ever transfers to an org, either add the free
# license key as a secret or drop this step and restore the pinned-binary
# invocation from git history.
#
# NOTE on cost: the self-hosted runners share the maintainer's workstation
# (see the Clone detection workflow for the full economics). All three scans
# together take well under a minute locally, so this stays one job,
# sequential steps, one checkout, no matrix.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    # Self-hosted: GitHub-hosted minutes are exhausted.
    runs-on: arc-runners
    permissions:
      contents: read
      # gitleaks-action lists the PR's commits via the API to compute its
      # scan range, and posts the finding as an inline PR comment. Without
      # this the action 403s ("Resource not accessible by integration")
      # before it scans anything.
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # gitleaks needs the PR's merge-base reachable to compute
          # base^..head; a shallow clone would silently narrow the scan.
          fetch-depth: 0

      # Pinned by commit SHA (repo convention). GITLEAKS_VERSION pins the
      # binary the action downloads, so the action code AND the detector are
      # both pinned — and the version matches the one the .gitleaks.toml
      # allowlist was validated against.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

      # Docker-less trufflehog: the official action requires docker run
      # (unavailable on these runners), so use this MIT-licensed composite
      # that installs a pinned, checksum-verified binary and execs it with
      # our args (--fail: exit 1 on findings). Pinned by commit SHA (repo
      # convention); action.yml is unchanged between v3.0.0 and the repo
      # HEAD, so the tag SHA pins the exact step code.
      # --no-update: without it the binary's self-updater runs first and can
      # fail (exit 1) purely because it cannot replace its own install path —
      # an updater error, not a finding.
      # Full history (not just the PR range): verification against the live
      # provider is a different question from gitleaks' regex match, and a
      # key that was committed and deleted last year is still live until
      # revoked.
      - uses: cboone/gh-actions/actions/run-trufflehog@91f9abd25d4f82354c0f950dfc8b6d7525b0f5b5  # v3.0.0
        with:
          version: 3.97.0
          args: |
            git
            file://${{ github.workspace }}
            --only-verified
            --no-update
            --fail
            --github-actions

      # Pinned by commit SHA (repo convention), matching the dupdelta
      # pattern: the gate logic is versioned in the action's own repo, where
      # its CI proves it on every change (unit tests + integration fixtures:
      # clean tree passes, planted token fails, line drift passes).
      - uses: elecnix/detect-secrets-action@658e6ddc85a1dfa64f7a355eaf2f73bc9663e274  # v1.0.0
        with:
          baseline: .secrets.baseline
          detect_secrets_version: "1.5.0"
